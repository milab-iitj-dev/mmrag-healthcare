name: healthcare_mrag
channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  # Python
  - python=3.10

  # PyTorch with CUDA (adjust cuda version to match your GPU driver)
  - pytorch>=2.1.0
  - torchvision>=0.16.0
  - pytorch-cuda=11.8         # change to 12.1 if your driver supports it

  # Core
  - pip
  - pyyaml>=6.0
  - pillow>=10.0.0
  - tqdm>=4.65.0

  # Development
  - pytest>=8.0.0
  - matplotlib>=3.8.0

  # pip-only packages (not available via conda)
  - pip:
    - transformers>=4.40.0
    - accelerate>=0.27.0
    - bitsandbytes>=0.43.0
    - peft>=0.10.0
    # Phase 2+ (uncomment as needed)
    # - nltk>=3.8.0
    # - rouge-score>=0.1.2
    # - bert-score>=0.3.13
    # - rank-bm25>=0.2.2
    # - faiss-cpu>=1.7.4
    # - open-clip-torch>=2.24.0
    # - colpali-engine>=0.3.0
    # - sentence-transformers>=2.6.0
