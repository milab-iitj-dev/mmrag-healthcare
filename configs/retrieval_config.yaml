# ============================================================
# Retrieval Configuration — Healthcare MRAG Phase 2
# ============================================================
# Controls retrieval methods, index paths, and fusion settings.
#
# Phase 2: ColQwen2 only (no BM25, CLIP, RRF, reranking)
# ============================================================

retrieval:
  # Which retriever(s) to use
  # Phase 2: "colqwen2" only
  # Future: "bm25", "clip", "hybrid"
  method: "colqwen2"

  # Number of documents to retrieve
  top_k: 3

  # --- BM25 Settings (Phase 3 — not yet implemented) ---
  bm25:
    enabled: false
    k1: 1.5                              # term frequency saturation
    b: 0.75                              # document length normalization
    tokenizer: "simple"                  # "simple" | "scispacy" | "nltk"
    index_path: "data/indexes/bm25_index.pkl"

  # --- CLIP Settings (Phase 3 — not yet implemented) ---
  clip:
    enabled: false
    model_name: "openai/clip-vit-base-patch32"
    batch_size: 32
    index_path: "data/indexes/clip_faiss.index"
    embeddings_path: "data/indexes/clip_embeddings.npy"

  # --- ColQwen2 Settings (Phase 2 — active) ---
  colqwen2:
    enabled: true
    model_name: "vidore/colqwen2-v1.0"
    batch_size: 4                        # conservative for VRAM
    index_path: "data/indexes/colqwen2_index/"

  # --- RRF Fusion Settings (Phase 3 — not yet implemented) ---
  rrf:
    k: 60                                # RRF constant (standard = 60)
    weights:
      bm25: 1.0
      clip: 1.0
      colqwen2: 1.5                      # give vision retrieval more weight

# --- Reranking (Phase 3 — not yet implemented) ---
reranking:
  enabled: false
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  batch_size: 16
  max_length: 512

# --- Context Building ---
context:
  max_context_tokens: 1024               # token budget for retrieved evidence
  include_scores: true                   # show relevance scores in context

# --- Index Paths ---
index:
  base_dir: "data/indexes"
  document_store_path: "data/indexes/colqwen2_index/document_store.json"
