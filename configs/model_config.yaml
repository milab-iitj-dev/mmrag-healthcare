# ============================================================
# Model Configuration — Healthcare MRAG Phase 4
# ============================================================
# Qwen2.5-VL-7B for grounded medical VQA.
# Stronger instruction following than LLaVA-1.5-7B.
# Fits on A100 40GB with 4-bit quantization (~12GB VRAM).
# ============================================================

model:
  name: "qwen2.5-vl-7b"
  model_id: "Qwen/Qwen2.5-VL-7B-Instruct"
  device: "auto"                          # "auto", "cuda:0", "cpu"

  quantization:
    enabled: true
    bits: 4
    method: "bitsandbytes"                # "bitsandbytes" | "gptq" | "awq"
    bnb_4bit_compute_dtype: "bfloat16"
    bnb_4bit_quant_type: "nf4"
    bnb_4bit_use_double_quant: true

  generation:
    max_new_tokens: 512
    temperature: 0.1
    top_p: 0.9
    do_sample: false
    repetition_penalty: 1.1

  # LoRA / QLoRA fine-tuning settings (future)
  lora:
    r: 16
    lora_alpha: 32
    lora_dropout: 0.05
    target_modules:
      - "q_proj"
      - "v_proj"
      - "k_proj"
      - "o_proj"
    bias: "none"
    task_type: "CAUSAL_LM"

# ============================================================
# To switch back to LLaVA-1.5-7B, change:
#   name: "llava-1.5-7b"
#   model_id: "llava-hf/llava-1.5-7b-hf"
# ============================================================
